<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shipment OTP Auth</title>
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background-color: #0a0a0a;
      overflow: hidden;
      color: #ccc;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    .title {
      color: gold;
      font-size: 2em;
      margin-bottom: 1em;
      text-shadow: 0 0 10px gold;
    }

    .otp-slots {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .otp-slot {
      width: 40px;
      height: 50px;
      background: #1a1a1a;
      border: 1px solid #555;
      color: silver;
      font-size: 1.5em;
      text-align: center;
      line-height: 50px;
      border-radius: 5px;
      box-shadow: 0 0 5px #444;
    }

    button {
      padding: 10px 20px;
      background: gold;
      color: #111;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px gold;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
    }

    .sci-fi-text {
      font-size: 0.9em;
      margin-top: 20px;
      color: silver;
      text-align: center;
      animation: flicker 4s infinite;
      letter-spacing: 1px;
      max-width: 600px;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      pointer-events: none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <div class="title">Secure Shipment Code</div>
    <div class="otp-slots" id="otpContainer">
      <!-- 9 OTP slots -->
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
      <div class="otp-slot">-</div>
    </div>
    <button onclick="generateOTP()">SHOW OTP</button>
    <div class="sci-fi-text">
      Authenticating shipment delivery request. Please validate the generated alphanumeric code to confirm access through the secured cyber-auth channel.
    </div>
  </div>

  <script>
    const predefinedOTP = "4K45H4RT5"; // 9-character alphanumeric

    function generateOTP() {
      const slots = document.querySelectorAll('.otp-slot');
      for (let i = 0; i < 9; i++) {
        slots[i].textContent = predefinedOTP[i];
      }
    }

    // Particle Animation Background
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.5;
        this.speedY = 0.5 + Math.random();
      }

      update() {
        this.y += this.speedY;
        if (this.y > canvas.height) this.reset();
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fill();
      }
    }

    function initParticles(num) {
      particles = [];
      for (let i = 0; i < num; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles(100);
    animateParticles();
  </script>
</body>
</html>
